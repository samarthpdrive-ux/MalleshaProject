<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Salon Admin</title><link rel="stylesheet" href="admin.css"></head><body><main><section id="login" class="card login"><p> MALLESHA HAIR STUDIO</p><h1>Admin panel</h1><form id="loginForm"><input id="password" type="password" placeholder="Admin password" required><button>Sign in</button></form><small id="loginMessage"></small></section><section id="dashboard" hidden><header><div><p>MALLESHA HAIR STUDIO</p><h1>Video manager</h1></div><button id="logout" class="secondary">Log out</button></header><div class="layout"><article class="card"><h2>Add Cloudinary account</h2><p class="hint">Credentials are encrypted before being saved on the server.</p><form id="accountForm"><input name="name" placeholder="Account name" required><input name="cloudName" placeholder="Cloud name" required><input name="apiKey" placeholder="API key" required><input name="apiSecret" type="password" placeholder="API secret" required><button>Save account</button></form><div id="accounts"></div></article><article class="card"><h2>Upload salon video</h2><form id="uploadForm"><select name="accountId" id="accountSelect" required><option value="">Choose account</option></select><input name="title" placeholder="Video title" required><input name="category" placeholder="Category (Bridal, Hair Colour...)" required><input name="artist" placeholder="Artist"><textarea name="description" placeholder="Description"></textarea><input name="video" type="file" accept="video/mp4" required><button>Upload MP4</button></form><small id="uploadMessage"></small></article></div><article class="card"><h2>Published videos</h2><div id="videos" class="videos"></div></article></section></main><script src="admin.js"></script></body></html>
